name: Build Releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller==6.10.0 certifi
      - run: pyinstaller --onefile --windowed --name "MapleTranslator" translator.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/MapleTranslator.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller==6.10.0 certifi
      - name: Build .app
        run: pyinstaller --windowed --name "MapleTranslator" translator.py
      - name: Ad-hoc codesign (required to run on Apple Silicon)
        run: codesign --force --deep --sign - dist/MapleTranslator.app
      - name: Zip .app
        run: cd dist && zip -r MapleTranslator-Mac.zip MapleTranslator.app
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/MapleTranslator-Mac.zip

  release:
    needs: [build-windows, build-mac]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: MapleTranslator v1.1.${{ github.run_number }}
          body: |
            冒险岛翻译小工具 - 中英文互译

            **Windows**：下载 `MapleTranslator.exe`，双击运行。
            **Mac**：下载 `MapleTranslator-Mac.zip`，解压得到 `MapleTranslator.app`。
              第一次打开请**右键 → 打开**（绕过未签名提示），之后双击即可。
          files: |
            artifacts/windows/MapleTranslator.exe
            artifacts/mac/MapleTranslator-Mac.zip
