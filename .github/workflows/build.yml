name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller==6.10.0

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "MapleTranslator" translator.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapleTranslator-Windows
          path: dist/MapleTranslator.exe

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MapleTranslator v1.0.${{ github.run_number }}
          body: |
            冒险岛翻译小工具 - Windows 版

            **使用方法**：下载 `MapleTranslator.exe`，双击打开即可。
          files: dist/MapleTranslator.exe
